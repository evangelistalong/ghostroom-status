<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --navy: #1a3c6e; --navy-dark: #12294c; --bg: #f2f4f8; --card: #ffffff;
      --ink: #1c2430; --muted: #67738a; --line: #e2e7ef;
      --green: #1e7d43; --green-bg: #e2f3e8; --amber: #92600a; --amber-bg: #fdf1d7;
      --red: #b3352c;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: var(--navy); color: #fff; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    header h1 { font-size: 19px; }
    header .who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    header select { border-radius: 8px; border: none; padding: 6px 10px; font-size: 14px; }
    main { max-width: 1080px; margin: 0 auto; padding: 18px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .card .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .card.owed .value { color: var(--amber); }
    .card.paid .value { color: var(--green); }

    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
    .panel h2 { font-size: 15px; margin-bottom: 12px; color: var(--navy); }
    form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
    input, select, button, textarea { font: inherit; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .full { grid-column: 1 / -1; }
    .btn { background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--navy-dark); }
    .btn[disabled] { opacity: .5; cursor: wait; }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    .btn-sm.green { color: var(--green); border-color: var(--green); }
    .btn-sm.red { color: var(--red); border-color: #eccfcd; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .filters select { width: auto; }

    .month-block { margin-bottom: 16px; }
    .month-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 4px; }
    .month-head strong { font-size: 15px; }
    .month-head .sub { color: var(--muted); font-size: 13px; }

    .tbl-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
    td.desc { white-space: normal; min-width: 160px; }
    th { background: #f7f9fc; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    tr:last-child td { border-bottom: none; }
    .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
    .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .chip.Pending { background: var(--amber-bg); color: var(--amber); }
    .chip.Reimbursed { background: var(--green-bg); color: var(--green); }
    .meta { color: var(--muted); font-size: 12px; }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: .95; }
    #loading { text-align: center; color: var(--muted); padding: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>🇺🇸 US Vacation — Samit Reimbursement</h1>
    <div class="who">
      I am:
      <select id="whoami" onchange="saveWho()"></select>
    </div>
  </header>

  <main>
    <div class="cards">
      <div class="card"><div class="label">Total spent</div><div class="value" id="statTotal">–</div></div>
      <div class="card owed"><div class="label">Samit still owes</div><div class="value" id="statOwed">–</div></div>
      <div class="card paid"><div class="label">Reimbursed</div><div class="value" id="statPaid">–</div></div>
      <div class="card"><div class="label">Expenses logged</div><div class="value" id="statCount">–</div></div>
    </div>

    <div class="panel">
      <h2>➕ Add expense</h2>
      <!-- novalidate: the browser blocks submit BEFORE onsubmit fires, so an
           invalid field would leave the button looking dead with no message.
           We check validity ourselves and say what's missing. -->
      <form class="grid" id="form" novalidate onsubmit="return submitExpense(event)">
        <div><label>Date</label><input type="date" id="fDate" required></div>
        <div><label>Category</label><select id="fCategory" required></select></div>
        <div><label>Amount (USD)</label><input type="number" id="fAmount" min="0.01" step="0.01" placeholder="0.00" required></div>
        <div><label>Paid by</label><select id="fPaidBy" required></select></div>
        <div><label>Reimburse month (auto = month after)</label><input type="month" id="fMonth"></div>
        <div class="full"><label>Description</label><input type="text" id="fDesc" placeholder="e.g. Hilton Orlando, 3 nights"></div>
        <div class="full"><label>Notes (optional)</label><input type="text" id="fNotes" placeholder="confirmation #, split details…"></div>
        <div class="full">
          <label>Receipt photo / screenshot — read automatically when a key is set</label>
          <!-- No `capture` attribute: it would force the camera and hide the
               photo library. Without it the phone offers camera, library and
               files, which is what you want for screenshots of bookings. -->
          <input type="file" id="fReceipt" accept="image/*" onchange="pickReceipt(this)">
          <div id="receiptPreview" style="display:none; margin-top:8px;">
            <img id="receiptImg" alt="receipt preview" style="max-height:120px; max-width:100%; border-radius:8px; border:1px solid var(--line);">
            <button type="button" class="btn-sm red" onclick="clearReceipt()">Remove</button>
            <button type="button" class="btn-sm" id="rescanBtn" onclick="scanReceipt()" style="display:none;">🔍 Read it again</button>
            <div id="scanStatus" class="meta" style="margin-top:4px;"></div>
          </div>
        </div>
        <div class="full"><button class="btn" id="fSubmit" type="submit">Add expense</button></div>
      </form>
    </div>

    <div class="panel">
      <h2>📋 Expenses by reimbursement month</h2>
      <div class="filters">
        <select id="filterStatus" onchange="render()">
          <option value="">All statuses</option>
          <option>Pending</option>
          <option>Reimbursed</option>
        </select>
        <select id="filterCategory" onchange="render()"><option value="">All categories</option></select>
        <select id="filterPerson" onchange="render()"><option value="">Everyone</option></select>
      </div>
      <div id="loading">Loading…</div>
      <div id="list"></div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    var DATA = { people: [], categories: [], expenses: [] };

    function $(id) { return document.getElementById(id); }
    function usd(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function toast(msg) {
      var t = $('toast'); t.textContent = msg; t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 2500);
    }
    function fail(err) { toast('⚠️ ' + (err && err.message ? err.message : err)); setBusy(false); }
    var submitting = false;
    function setBusy(b) { submitting = b; $('fSubmit').disabled = b; }

    // ------- boot -------
    google.script.run.withSuccessHandler(boot).withFailureHandler(fail).getData();

    function boot(data) {
      DATA = data;
      fillSelect($('fCategory'), data.categories);
      fillSelect($('fPaidBy'), data.people);
      fillSelect($('whoami'), data.people);
      appendOptions($('filterCategory'), data.categories);
      appendOptions($('filterPerson'), data.people);
      var who = localStorage.getItem('vacay-who');
      if (who && data.people.indexOf(who) !== -1) {
        $('whoami').value = who;
        $('fPaidBy').value = who;
      }
      $('fDate').valueAsDate = new Date();
      $('loading').style.display = 'none';
      render();
    }

    function fillSelect(sel, items) {
      sel.innerHTML = items.map(function (i) { return '<option>' + esc(i) + '</option>'; }).join('');
    }
    function appendOptions(sel, items) {
      sel.innerHTML += items.map(function (i) { return '<option>' + esc(i) + '</option>'; }).join('');
    }
    function saveWho() {
      localStorage.setItem('vacay-who', $('whoami').value);
      $('fPaidBy').value = $('whoami').value;
    }

    // ------- receipt photo -------
    var receiptB64 = ''; // compressed JPEG, base64 without the data: prefix

    function pickReceipt(input) {
      var file = input.files && input.files[0];
      if (!file) { clearReceipt(); return; }
      var reader = new FileReader();
      reader.onload = function (e) { compressImage(e.target.result); };
      reader.readAsDataURL(file);
    }

    // Shrink to max 1600px and JPEG-encode so uploads stay small & fast.
    function compressImage(dataUrl) {
      var img = new Image();
      img.onload = function () {
        var MAX = 1600;
        var scale = Math.min(1, MAX / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        var jpeg = canvas.toDataURL('image/jpeg', 0.8);
        receiptB64 = jpeg.split(',')[1];
        $('receiptImg').src = jpeg;
        $('receiptPreview').style.display = 'block';
        if (DATA.scanner) scanReceipt();
      };
      img.onerror = function () { fail(new Error('Could not read that image.')); clearReceipt(); };
      img.src = dataUrl;
    }

    function clearReceipt() {
      receiptB64 = '';
      $('fReceipt').value = '';
      $('receiptPreview').style.display = 'none';
      $('scanStatus').textContent = '';
      $('rescanBtn').style.display = 'none';
    }

    // Ask Claude to read the receipt, then pre-fill the form. Everything it
    // fills in stays editable — this is a head start, not the final word.
    function scanReceipt() {
      if (!receiptB64) return;
      $('rescanBtn').style.display = 'none';
      $('scanStatus').textContent = '🔍 Reading the receipt…';
      google.script.run
        .withSuccessHandler(applyScan)
        .withFailureHandler(function () { scanFailed('Could not reach the reader.'); })
        .scanReceipt(receiptB64);
    }

    function applyScan(r) {
      $('rescanBtn').style.display = '';
      if (!r || !r.ok) {
        scanFailed(r && r.reason === 'refused'
          ? 'Reader declined this image — enter the amount manually.'
          : 'Could not read it — enter the amount manually.');
        return;
      }
      if (r.total > 0) $('fAmount').value = Number(r.total).toFixed(2);
      setDateSafely(r.date);
      if (r.merchant && !$('fDesc').value) $('fDesc').value = r.merchant;
      setCategorySafely(r.category);
      if (r.notes && !$('fNotes').value) $('fNotes').value = r.notes;
      if (!submitting) setBusy(false); // never leave the button stuck

      var flag = r.confidence === 'high' ? '✅' : '⚠️';
      var msg = flag + ' Read ' + (r.total > 0 ? usd(r.total) : 'no total') +
        (r.merchant ? ' at ' + r.merchant : '') +
        ' (' + r.confidence + ' confidence). Check it before saving.';
      if (r.currency && r.currency !== 'USD') msg += ' Receipt is in ' + r.currency + ' — convert to USD.';
      $('scanStatus').textContent = msg;
    }

    function scanFailed(msg) {
      $('rescanBtn').style.display = '';
      $('scanStatus').textContent = '⚠️ ' + msg;
    }

    // A date input silently blanks itself if handed anything but yyyy-mm-dd,
    // and the field is required — so a stray format would block submitting.
    // Normalize first, and keep the old value if the browser still refuses.
    function setDateSafely(v) {
      if (!v) return;
      var s = String(v).trim();
      var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) {
        s = iso[1] + '-' + iso[2] + '-' + iso[3];
      } else {
        var d = new Date(s); // tolerate "Aug 12, 2026", "08/12/2026", etc.
        if (isNaN(d.getTime())) return;
        s = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) +
            '-' + ('0' + d.getDate()).slice(-2);
      }
      var el = $('fDate');
      var previous = el.value;
      el.value = s;
      if (!el.value) el.value = previous;
    }

    // Same trap on the category dropdown: assigning a value with no matching
    // option leaves the select empty, and it's required too.
    function setCategorySafely(c) {
      if (!c) return;
      var sel = $('fCategory');
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === c) { sel.value = c; return; }
      }
    }

    // Returns a plain-language description of the first missing field.
    function whatsMissing() {
      if (!$('fDate').value) return 'a date';
      if (!$('fCategory').value) return 'a category';
      if (!(Number($('fAmount').value) > 0)) return 'an amount';
      if (!$('fPaidBy').value) return 'who paid';
      return '';
    }

    // ------- add -------
    function submitExpense(ev) {
      ev.preventDefault();
      var missing = whatsMissing();
      if (missing) {
        toast('⚠️ Add ' + missing + ' first');
        $('form').reportValidity();
        return false;
      }
      setBusy(true);
      google.script.run.withSuccessHandler(function (data) {
        refresh(data);
        $('fAmount').value = ''; $('fDesc').value = ''; $('fNotes').value = ''; $('fMonth').value = '';
        clearReceipt();
        setBusy(false);
        toast('✅ Expense added');
      }).withFailureHandler(fail).addExpense({
        date: $('fDate').value,
        category: $('fCategory').value,
        amount: $('fAmount').value,
        paidBy: $('fPaidBy').value,
        reimburseMonth: $('fMonth').value,
        description: $('fDesc').value,
        notes: $('fNotes').value,
        enteredBy: $('whoami').value,
        receiptB64: receiptB64
      });
      return false;
    }

    // ------- actions -------
    function setStatus(id, status) {
      google.script.run.withSuccessHandler(refresh).withFailureHandler(fail).setStatus(id, status);
    }
    function removeExpense(id, label) {
      if (confirm('Delete "' + label + '"? This cannot be undone.')) {
        google.script.run.withSuccessHandler(refresh).withFailureHandler(fail).deleteExpense(id);
      }
    }
    function payMonth(month, amount) {
      if (confirm('Mark ALL pending expenses for ' + month + ' (' + amount + ') as reimbursed by Samit?')) {
        google.script.run.withSuccessHandler(refresh).withFailureHandler(fail).reimburseMonth(month);
      }
    }
    function refresh(data) { DATA = data; render(); }

    // ------- render -------
    function render() {
      var fs = $('filterStatus').value, fc = $('filterCategory').value, fp = $('filterPerson').value;
      var rows = DATA.expenses.filter(function (e) {
        return (!fs || e.status === fs) && (!fc || e.category === fc) && (!fp || e.paidBy === fp);
      });

      var total = 0, paid = 0;
      DATA.expenses.forEach(function (e) {
        total += e.amount;
        if (e.status === 'Reimbursed') paid += e.amount;
      });
      $('statTotal').textContent = usd(total);
      $('statPaid').textContent = usd(paid);
      $('statOwed').textContent = usd(total - paid);
      $('statCount').textContent = DATA.expenses.length;

      // group by reimbursement month, newest month first
      var groups = {};
      rows.forEach(function (e) {
        var m = e.reimburseMonth || '(no month)';
        (groups[m] = groups[m] || []).push(e);
      });
      var months = Object.keys(groups).sort().reverse();

      if (!months.length) {
        $('list').innerHTML = '<p class="meta">No expenses match. Add one above! 🏖️</p>';
        return;
      }

      $('list').innerHTML = months.map(function (m) {
        var g = groups[m];
        var mTotal = 0, mPending = 0;
        g.forEach(function (e) { mTotal += e.amount; if (e.status === 'Pending') mPending += e.amount; });
        var head =
          '<div class="month-head"><strong>' + esc(m) + '</strong>' +
          '<span class="sub">' + usd(mTotal) + ' total · ' + usd(mPending) + ' pending</span>' +
          (mPending > 0
            ? '<button class="btn-sm green" onclick="payMonth(\'' + esc(m) + '\',\'' + usd(mPending) + '\')">💸 Samit paid this month</button>'
            : '<span class="chip Reimbursed">All reimbursed ✓</span>') +
          '</div>';
        var body = g.map(function (e) {
          var label = (e.description || e.category).replace(/'/g, '');
          var toggle = e.status === 'Pending'
            ? '<button class="btn-sm green" onclick="setStatus(\'' + e.id + '\',\'Reimbursed\')">Mark paid</button>'
            : '<button class="btn-sm" onclick="setStatus(\'' + e.id + '\',\'Pending\')">Undo</button>';
          return '<tr>' +
            '<td>' + esc(e.date) + '</td>' +
            '<td>' + esc(e.category) + '</td>' +
            '<td class="desc">' + esc(e.description) +
              (e.notes ? '<div class="meta">' + esc(e.notes) + '</div>' : '') +
              (e.receiptUrl ? '<div class="meta"><a href="' + esc(e.receiptUrl) + '" target="_blank" rel="noopener">📎 Receipt</a></div>' : '') + '</td>' +
            '<td class="amt">' + usd(e.amount) + '</td>' +
            '<td>' + esc(e.paidBy) + '</td>' +
            '<td><span class="chip ' + esc(e.status) + '">' + esc(e.status) + '</span>' +
              (e.reimbursedOn ? '<div class="meta">' + esc(e.reimbursedOn) + '</div>' : '') + '</td>' +
            '<td>' + toggle + ' <button class="btn-sm red" onclick="removeExpense(\'' + e.id + '\',\'' + esc(label) + '\')">✕</button></td>' +
            '</tr>';
        }).join('');
        return '<div class="month-block">' + head +
          '<div class="tbl-wrap"><table><thead><tr>' +
          '<th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Paid by</th><th>Status</th><th></th>' +
          '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
      }).join('');
    }
  </script>
</body>
</html>
